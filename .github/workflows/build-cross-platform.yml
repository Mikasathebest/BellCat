name: Build cross-platform packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: BellCat-Windows-x64
            output: BellCat.exe
          - os: ubuntu-latest
            artifact: BellCat-Linux-x64
            output: BellCat
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: pip install -r CrossPlatform/requirements-build.txt
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk libnotify-bin
      - name: Build BellCat
        run: pyinstaller --onefile --windowed --name BellCat --icon AppResources/BellCat.ico CrossPlatform/bellcat.py
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/BellCat.exe,CrossPlatform/README.md,LICENSE -DestinationPath BellCat-Windows-x64.zip
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Package Linux
        if: runner.os == 'Linux'
        run: tar -czf BellCat-Linux-x64.tar.gz -C dist BellCat -C ../CrossPlatform README.md -C .. LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            BellCat-Windows-x64.zip
            BellCat-2.2.1-Windows-x64-Setup.exe
            BellCat-Linux-x64.tar.gz
          if-no-files-found: ignore
      - name: Attach packages to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BellCat-Windows-x64.zip
            BellCat-2.2.1-Windows-x64-Setup.exe
            BellCat-Linux-x64.tar.gz
